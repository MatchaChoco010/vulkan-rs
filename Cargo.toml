[workspace]
members = [
    "crates/vulkan",
    "crates/vulkan-alloc",
    "crates/vulkan-codegen",
    "crates/vulkan-registry",
    "crates/source-lint",
    "examples/*",
    "tests/render-compare",
]
resolver = "3"

[workspace.package]
# `<crate semver>+<Vulkan-Headers SDK tag>`. See README.md "Versioning".
version = "0.4.0+vulkan-sdk-1.4.363.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/MatchaChoco010/vulkan-rs"

[workspace.dependencies]
vulkan = { path = "crates/vulkan", version = "0.4.0", default-features = false }
vulkan-alloc = { path = "crates/vulkan-alloc", version = "0.4.0" }
vulkan-registry = { path = "crates/vulkan-registry", version = "0.4.0" }

# Most of the time of the tests is spent in dependencies (regex and syn, in the test that
# compares the generated documentation with the specification), so the dependencies are
# optimized. The crates of the workspace are not.
[profile.dev.package."*"]
opt-level = 3
