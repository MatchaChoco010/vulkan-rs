[package]
name = "vulkan"
description = "Pure Rust Vulkan bindings generated from Khronos Vulkan-Headers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
default = ["std", "debug"]
# Load the Vulkan loader at runtime (`Entry::load`). Without it the crate is `no_std` + `alloc`.
std = ["dep:libloading"]
# Link the Vulkan loader at build time (`Entry::linked`).
linked = []
# Derive `Debug` for structs. Enums, flags and handles always implement `Debug`.
debug = []

# Provisional extensions (`VK_ENABLE_BETA_EXTENSIONS`).
beta = []

# Platform window system integration (`VK_USE_PLATFORM_*`). Each name is the registry's
# platform name; `tools/generate-vulkan` fails if the registry gains one that is missing here.
android = []
directfb = []
fuchsia = []
ggp = []
ios = []
macos = []
metal = []
ohos = []
sci = []
screen = []
ubm = []
vi = []
wayland = []
win32 = []
xcb = []
xlib = []
xlib-xrandr = ["xlib"]

[dependencies]
libloading = { version = "0.8", optional = true }

[dev-dependencies]
trybuild = "1"

[package.metadata.docs.rs]
all-features = true
