name: Update Vulkan-Headers

# Looks for a new Vulkan SDK tag of Khronos Vulkan-Headers once a week. When there is
# one, regenerates the bindings, runs the checks and opens a pull request. The pull
# request is a draft when a check failed, so that the failure is fixed in the generator
# or the hand-written code before merging.

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
    inputs:
      tag:
        description: "SDK tag to move to (default: the newest vulkan-sdk-* tag)"
        required: false

permissions:
  contents: write
  pull-requests: write

env:
  CARGO_TERM_COLOR: always
  VULKAN_RS_REQUIRE_LAYOUT_TEST: "1"
  VULKAN_RS_REQUIRE_DEVICE_TEST: "1"

jobs:
  update:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install lavapipe, the Vulkan loader and the validation layers
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            libvulkan1 mesa-vulkan-drivers vulkan-validationlayers \
            pkg-config libwayland-dev libxkbcommon-dev

      # The version, profile and components come from rust-toolchain.toml.
      - name: Install Rust
        run: |
          rustup toolchain install
          cargo --version

      - name: Update the submodule and regenerate
        id: update
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if [ -n "$TAG" ]; then
            ./tools/update-vulkan-headers --github-output --tag "$TAG"
          else
            ./tools/update-vulkan-headers --github-output
          fi

      - name: Stop if a pull request for this tag already exists
        id: existing
        if: steps.update.outputs.updated == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: update/${{ steps.update.outputs.new_tag }}
        run: |
          if [ -n "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number')" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check
        id: check
        if: steps.update.outputs.updated == 'true' && steps.existing.outputs.exists == 'false'
        continue-on-error: true
        run: |
          set -o pipefail
          {
            cargo fmt --check
            cargo clippy --workspace --all-features --all-targets -- -D warnings
            cargo test --workspace --all-features
          } 2>&1 | tee check.log

      - name: Open a pull request
        if: steps.update.outputs.updated == 'true' && steps.existing.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          OLD_TAG: ${{ steps.update.outputs.old_tag }}
          NEW_TAG: ${{ steps.update.outputs.new_tag }}
          CHECK: ${{ steps.check.outcome }}
        run: |
          branch="update/$NEW_TAG"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --create "$branch"
          git add --all -- . ':!check.log'
          git commit --message "Update Vulkan bindings to $NEW_TAG"
          git push --force origin "$branch"

          {
            echo "Regenerated by \`tools/update-vulkan-headers\`: \`$OLD_TAG\` -> \`$NEW_TAG\`."
            echo
            echo "- Registry changes: \`crates/vulkan-registry/vulkan-ir.json\`"
            echo "- API changes: \`crates/vulkan/src/vk/generated/\`"
            echo
            if [ "$CHECK" = "success" ]; then
              echo "fmt, clippy and the tests (ABI cross-check against the C headers, lavapipe) pass."
            else
              echo "**The checks failed.** Fix the generator or the hand-written code on this branch."
              echo
              echo '```'
              tail -n 60 check.log
              echo '```'
            fi
            echo
            echo "Workflows do not run on pull requests opened by GitHub Actions. Close and"
            echo "reopen this pull request, or push to the branch, to run CI on it."
          } > body.md

          draft=()
          if [ "$CHECK" != "success" ]; then draft=(--draft); fi
          gh pr create --base main --head "$branch" \
            --title "Update Vulkan bindings to $NEW_TAG" --body-file body.md "${draft[@]}"
