name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Fail instead of skipping when the C headers, the specification sources or a Vulkan
  # device are missing.
  VULKAN_RS_REQUIRE_LAYOUT_TEST: "1"
  VULKAN_RS_REQUIRE_DOCS_TEST: "1"
  VULKAN_RS_REQUIRE_DEVICE_TEST: "1"
  # The packages that make and check the sources. The test-tools job runs their tests,
  # and the test job those of every other package.
  TOOL_PACKAGES: source-lint vulkan-codegen vulkan-registry

jobs:
  # What does not run the tests: the formatting, the generated files, the lints and the
  # documentation.
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      # tools/generate-vulkan names the bindings after the SDK tag of the submodule
      # commit, and the checkout above does not fetch tags. Only the tags of that commit
      # are fetched: every other tag would bring its own commit along.
      - name: Fetch the Vulkan-Headers SDK tags of the submodule commit
        run: |
          commit=$(git -C third_party/vulkan rev-parse HEAD)
          git -C third_party/vulkan ls-remote --tags origin 'vulkan-sdk-*' \
            | awk -v commit="$commit" '$1 == commit { sub(/\^\{\}$/, "", $2); print $2 ":" $2 }' \
            | sort -u \
            | xargs --no-run-if-empty git -C third_party/vulkan fetch --quiet --depth=1 origin
          git -C third_party/vulkan tag --points-at HEAD

      # Build dependencies of the Wayland examples (winit), whose build scripts run for
      # clippy and rustdoc as well.
      - name: Install the build dependencies of the examples
        uses: ./.github/actions/install-apt-packages
        with:
          packages: pkg-config libwayland-dev libxkbcommon-dev

      # The version, profile and components come from rust-toolchain.toml.
      - name: Install Rust
        run: |
          rustup toolchain install
          cargo --version

      # The action leaves the profiles out of its key, and the profile in the root manifest
      # decides how the cached dependencies are built.
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ hashFiles('Cargo.toml') }}

      - name: Format
        run: cargo fmt --check

      - name: Generated files are up to date
        run: ./tools/generate-vulkan --check

      # The user-facing crates warn about public items without documentation, which
      # fails here.
      - name: Clippy
        run: cargo clippy --workspace --all-features --all-targets -- -D warnings

      # Broken links between items fail. The second run has no platform feature enabled,
      # so it catches a link from an item that always exists to one behind a feature.
      - name: Documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: |
          cargo doc --workspace --all-features --no-deps
          cargo doc -p vulkan -p vulkan-alloc --no-deps

  test-tools:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      # The version, profile and components come from rust-toolchain.toml.
      - name: Install Rust
        run: |
          rustup toolchain install
          cargo --version

      # The key: see the lint job.
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ hashFiles('Cargo.toml') }}

      # The tests of source-lint are the rules that rustfmt and clippy do not have: the
      # Rust sources under crates/ have no comments other than doc comments on the public
      # API of the user-facing crates, and the versions and SDK tags named in the Markdown
      # files match the workspace version in Cargo.toml.
      - name: Test the lints and the generator
        run: cargo test --all-features $(printf -- '-p %s ' $TOOL_PACKAGES)

  test:
    runs-on: ubuntu-24.04
    steps:
      # The submodules: the C headers (crates/vulkan/tests/layout.rs) and the
      # specification sources (crates/vulkan/tests/docs.rs).
      - uses: actions/checkout@v7
        with:
          submodules: true

      # libvulkan-dev: the `linked` feature links the loader. libwayland-dev and
      # libxkbcommon-dev: build dependencies of the Wayland examples (winit).
      - name: Install lavapipe, the Vulkan loader and the validation layers
        uses: ./.github/actions/install-apt-packages
        with:
          packages: >-
            libvulkan1 mesa-vulkan-drivers vulkan-validationlayers vulkan-tools
            libvulkan-dev pkg-config libwayland-dev libxkbcommon-dev

      - name: Show the Vulkan devices and layers
        run: vulkaninfo --summary

      # The version, profile and components come from rust-toolchain.toml.
      - name: Install Rust
        run: |
          rustup toolchain install
          cargo --version

      # The key: see the lint job.
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ hashFiles('Cargo.toml') }}

      # Includes the examples in the documentation (doctests) and the comparison of the
      # generated documentation with the specification sources (crates/vulkan/tests/docs.rs).
      - name: Test
        run: >-
          cargo test --workspace --all-features
          $(printf -- '--exclude %s ' $TOOL_PACKAGES) --exclude vulkan-render-compare

      # A device test skips itself when the driver lacks the extension it exercises.
      # cargo hides the output of passing tests, so list the skips where they can be seen.
      - name: Report what the device tests skipped
        run: |
          {
            echo "### Device tests"
            echo '```'
            cargo test -p vulkan -p vulkan-alloc --all-features --test device -- --nocapture --test-threads=1 2>&1 \
              | grep -E "device test on|skipping|test result" \
              | sed -E 's/^test [a-z_0-9:]+ \.\.\. //' | sort | uniq -c
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # The examples print what the validation layer reports and carry on, so a message
      # has to fail the step here. The other headless examples need Vulkan 1.4 or
      # extensions that this lavapipe lacks; the recent-lavapipe job runs them.
      - name: Run headless examples on lavapipe
        shell: bash
        run: |
          log="$RUNNER_TEMP/examples.log"
          for example in headless-triangle; do
            cargo run -p "vulkan-$example" 2>&1 | tee -a "$log"
          done
          {
            echo "### Examples"
            echo '```'
            grep -E "^(skipped|wrote|all [0-9]+ values match)" "$log" | sed -E 's#/[^ ]*/target/#target/#' || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if grep -E "Validation Error|VUID-" "$log"; then
            echo "::error::an example produced a validation message"
            exit 1
          fi

      - name: Upload example images
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: example-output
          path: target/example-output/
          if-no-files-found: ignore

  # Without the `std` feature the crate neither loads nor links the Vulkan loader, so
  # this job installs none, and the device tests are compiled out.
  test-no-default-features:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Install Rust
        run: |
          rustup toolchain install
          cargo --version

      # The key: see the lint job.
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ hashFiles('Cargo.toml') }}

      - name: Test without default features
        run: cargo test -p vulkan --no-default-features

  # The device tests and the headless examples on the lavapipe of a recent Mesa, which
  # has Vulkan 1.4 and the extensions that the lavapipe of Ubuntu 24.04 lacks
  # (VK_EXT_descriptor_heap among them). Here a device test or an example that skips
  # itself fails, except for the skips listed in the device test step.
  recent-lavapipe:
    runs-on: ubuntu-24.04
    container:
      image: fedora:45
      # lavapipe allocates dma-bufs through udmabuf and offers
      # VK_EXT_image_drm_format_modifier only when it can open the device.
      options: --device /dev/udmabuf
    defaults:
      run:
        shell: bash
    # Only lavapipe: the loader reports the other Mesa drivers, which find no device in
    # the container, as errors, and the device tests fail on those. lavapipe has no
    # VK_KHR_display, so the test of that extension skips itself here.
    env:
      VK_DRIVER_FILES: /usr/share/vulkan/icd.d/lvp_icd.x86_64.json
    steps:
      # The image has no git, so the action downloads an archive through the REST API.
      # Neither the device tests nor the examples read the submodules or the history.
      - uses: actions/checkout@v7

      # tar and zstd: Swatinem/rust-cache. gcc: the linker for Rust.
      # vulkan-loader-devel: the `linked` feature links the loader.
      - name: Install lavapipe, the Vulkan loader, the validation layers and the build tools
        uses: ./.github/actions/install-dnf-packages
        with:
          packages: >-
            tar zstd gcc rustup
            vulkan-loader vulkan-loader-devel mesa-vulkan-drivers
            vulkan-validation-layers vulkan-tools

      # The examples step below finds nothing when the layer is missing, so its absence
      # fails here.
      - name: Show the Vulkan devices and layers
        run: |
          vulkaninfo --summary | tee "$RUNNER_TEMP/vulkaninfo.txt"
          grep -q VK_LAYER_KHRONOS_validation "$RUNNER_TEMP/vulkaninfo.txt"

      # The version, profile and components come from rust-toolchain.toml. The container
      # runs as root with HOME set to another directory, which rustup-init otherwise
      # reports as a possible sudo.
      - name: Install Rust
        env:
          RUSTUP_INIT_SKIP_SUDO_CHECK: "yes"
        run: |
          rustup-init -y --no-modify-path --profile minimal --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          "$HOME/.cargo/bin/rustup" toolchain install
          "$HOME/.cargo/bin/cargo" --version

      # The key: see the lint job.
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ hashFiles('Cargo.toml') }}

      # A device test skips itself when the driver lacks the extension it exercises.
      # cargo hides the output of passing tests, so list the skips where they can be seen.
      # A skip fails the step unless it is in allowed_skips, which names what lavapipe
      # does not implement.
      - name: Device tests
        run: |
          log="$RUNNER_TEMP/device-tests.log"
          allowed_skips="$RUNNER_TEMP/allowed-device-test-skips.txt"
          printf '%s\n' \
            "skipping: VK_KHR_display is not supported" \
            > "$allowed_skips"
          cargo test -p vulkan -p vulkan-alloc --all-features --test device -- --nocapture --test-threads=1 2>&1 \
            | tee "$log"
          {
            echo "### Device tests"
            echo '```'
            grep -E "device test on|skipping|test result" "$log" \
              | sed -E 's/^test [a-z_0-9:]+ \.\.\. //' | sort | uniq -c
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          if grep -E "skipping" "$log" | grep -v -F -f "$allowed_skips"; then
            echo "::error::a device test skipped itself"
            exit 1
          fi

      # The examples print what the validation layer reports and carry on, so a message
      # has to fail the step here, and so does an example that skipped itself.
      - name: Run headless examples on lavapipe
        run: |
          log="$RUNNER_TEMP/examples.log"
          for example in headless-triangle compute-buffer descriptor-heap-14 dmabuf-roundtrip \
            mesh-shader ray-tracing-pipeline; do
            cargo run -p "vulkan-$example" 2>&1 | tee -a "$log"
          done
          {
            echo "### Examples"
            echo '```'
            grep -E "^(skipped|wrote|imported pixels match|all [0-9]+ values match)" "$log" \
              | sed -E 's#/[^ ]*/target/#target/#' || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if grep -E "Validation Error|VUID-" "$log"; then
            echo "::error::an example produced a validation message"
            exit 1
          fi
          if grep -E "^skipped" "$log"; then
            echo "::error::an example skipped itself"
            exit 1
          fi

      - name: Upload example images
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: example-output-recent-lavapipe
          path: target/example-output/
          if-no-files-found: ignore

  # tests/render-compare draws the same scenarios with a C program written against the
  # Vulkan headers and the loader and with a Rust program written against the vulkan crate,
  # and checks that both read back the same pixels, that the C pictures are the intended
  # ones, and that both programs make the same Vulkan calls with the same arguments, as
  # recorded by the gfxreconstruct capture layer. The pictures, their differences and the
  # recorded calls are uploaded as an artifact.
  render-compare:
    runs-on: ubuntu-24.04
    env:
      VULKAN_RS_REQUIRE_RENDER_COMPARE: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      # gcc and libvulkan-dev: the C program, built with the headers of third_party/vulkan.
      # gfxreconstruct: the capture layer and gfxrecon-convert.
      - name: Install lavapipe, the Vulkan loader, the validation layers and gfxreconstruct
        uses: ./.github/actions/install-apt-packages
        with:
          packages: >-
            gcc libvulkan1 libvulkan-dev mesa-vulkan-drivers vulkan-validationlayers
            vulkan-tools gfxreconstruct

      - name: Show the Vulkan devices and the version of gfxreconstruct
        run: |
          vulkaninfo --summary
          gfxrecon-convert --version

      - name: Install Rust
        run: |
          rustup toolchain install
          cargo --version

      # The key: see the lint job.
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ hashFiles('Cargo.toml') }}

      - name: Compare the renderings
        run: |
          set -o pipefail
          cargo test -p vulkan-render-compare -- --nocapture 2>&1 | tee "$RUNNER_TEMP/render-compare.log"

      - name: Summarize the comparison
        if: always()
        run: |
          {
            echo "### Render comparison"
            echo '```'
            grep -E "^test |made the same|skipping|differ|test result" "$RUNNER_TEMP/render-compare.log" || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the pictures and the recorded calls
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: render-compare
          path: target/render-compare/
          if-no-files-found: error

  # The same comparison on the lavapipe and the validation layers of a recent Mesa and
  # Vulkan SDK. Fedora has no package of gfxreconstruct, so the calls are compared in the
  # render-compare job only.
  render-compare-recent-lavapipe:
    runs-on: ubuntu-24.04
    container:
      image: fedora:45
    defaults:
      run:
        shell: bash
    env:
      VK_DRIVER_FILES: /usr/share/vulkan/icd.d/lvp_icd.x86_64.json
      VULKAN_RS_REQUIRE_RENDER_COMPARE: "1"
      VULKAN_RS_RENDER_COMPARE_TRACE: "0"
    steps:
      # The image has no git, so this checkout downloads an archive, which has the action
      # of the next step but not the submodule.
      - uses: actions/checkout@v7

      # git-core: the second checkout fetches the submodule with it. tar and zstd:
      # Swatinem/rust-cache. gcc: the C program and the linker for Rust.
      - name: Install lavapipe, the Vulkan loader, the validation layers and the build tools
        uses: ./.github/actions/install-dnf-packages
        with:
          packages: >-
            git-core tar zstd gcc rustup
            vulkan-loader vulkan-loader-devel mesa-vulkan-drivers
            vulkan-validation-layers vulkan-tools

      # The C program is built with the headers of the third_party/vulkan submodule.
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Show the Vulkan devices
        run: vulkaninfo --summary

      # See the recent-lavapipe job.
      - name: Install Rust
        env:
          RUSTUP_INIT_SKIP_SUDO_CHECK: "yes"
        run: |
          rustup-init -y --no-modify-path --profile minimal --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          "$HOME/.cargo/bin/rustup" toolchain install
          "$HOME/.cargo/bin/cargo" --version

      # The key: see the lint job.
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ hashFiles('Cargo.toml') }}

      - name: Compare the renderings
        run: |
          set -o pipefail
          cargo test -p vulkan-render-compare -- --nocapture 2>&1 | tee "$RUNNER_TEMP/render-compare.log"

      - name: Summarize the comparison
        if: always()
        run: |
          {
            echo "### Render comparison (recent lavapipe)"
            echo '```'
            grep -E "^test |made the same|skipping|differ|test result" "$RUNNER_TEMP/render-compare.log" || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the pictures
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: render-compare-recent-lavapipe
          path: target/render-compare/
          if-no-files-found: error

  # The comparison on a 32-bit target, where `usize` is narrower than `vk::DeviceSize` and
  # the i386 C ABI aligns 64-bit members of structs to 4 bytes. Ubuntu 24.04 has no i386
  # build of the validation layers or of gfxreconstruct, so this job compares the pixels
  # and the expected pictures without them.
  render-compare-i686:
    runs-on: ubuntu-24.04
    env:
      CARGO_BUILD_TARGET: i686-unknown-linux-gnu
      VULKAN_RS_REQUIRE_RENDER_COMPARE: "1"
      VULKAN_RS_RENDER_COMPARE_TRACE: "0"
      VULKAN_RS_RENDER_COMPARE_VALIDATION: "0"
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      # gcc-multilib: links the test binaries and builds the C program with -m32.
      # libvulkan-dev:i386: the C program links the loader.
      - name: Install the 32-bit C toolchain, lavapipe and the Vulkan loader
        uses: ./.github/actions/install-apt-packages
        with:
          architecture: i386
          packages: gcc-multilib libvulkan1:i386 libvulkan-dev:i386 mesa-vulkan-drivers:i386

      - name: Install Rust
        run: |
          rustup toolchain install
          rustup target add "$CARGO_BUILD_TARGET"
          cargo --version

      # The key: see the lint job.
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ hashFiles('Cargo.toml') }}

      - name: Compare the renderings
        run: |
          set -o pipefail
          cargo test -p vulkan-render-compare -- --nocapture 2>&1 | tee "$RUNNER_TEMP/render-compare.log"

      - name: Summarize the comparison
        if: always()
        run: |
          {
            echo "### Render comparison (i686)"
            echo '```'
            grep -E "^test |skipping|differ|test result" "$RUNNER_TEMP/render-compare.log" || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the pictures
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: render-compare-i686
          path: target/render-compare/
          if-no-files-found: error

  # The user-facing crates on a 32-bit target: `usize` is narrower than `vk::DeviceSize`,
  # and the i386 C ABI aligns 64-bit members of structs to 4 bytes.
  test-i686:
    runs-on: ubuntu-24.04
    env:
      CARGO_BUILD_TARGET: i686-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      # gcc-multilib: links the test binaries and builds the C side of the layout test
      # (crates/vulkan/tests/layout.rs) with -m32. libvulkan-dev:i386: the `linked` feature.
      # Ubuntu 24.04 has no i386 build of the validation layers, so the device tests run
      # without them here, and the test that needs VK_EXT_debug_utils skips itself.
      - name: Install the 32-bit C toolchain, lavapipe and the Vulkan loader
        uses: ./.github/actions/install-apt-packages
        with:
          architecture: i386
          packages: gcc-multilib libvulkan1:i386 libvulkan-dev:i386 mesa-vulkan-drivers:i386

      - name: Install Rust
        run: |
          rustup toolchain install
          rustup target add "$CARGO_BUILD_TARGET"
          cargo --version

      # The key: see the lint job.
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ hashFiles('Cargo.toml') }}

      # A failure in one test binary does not hide the results of the others.
      - name: Test
        run: cargo test -p vulkan -p vulkan-alloc --all-features --no-fail-fast

      - name: Report what the device tests skipped
        run: |
          {
            echo "### Device tests (i686)"
            echo '```'
            cargo test -p vulkan -p vulkan-alloc --all-features --test device -- --nocapture --test-threads=1 2>&1 \
              | grep -E "device test on|skipping|test result" \
              | sed -E 's/^test [a-z_0-9:]+ \.\.\. //' | sort | uniq -c
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

  test-i686-no-default-features:
    runs-on: ubuntu-24.04
    env:
      CARGO_BUILD_TARGET: i686-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      # gcc-multilib: links the test binaries and builds the C side of the layout test
      # (crates/vulkan/tests/layout.rs) with -m32.
      - name: Install the 32-bit C toolchain
        uses: ./.github/actions/install-apt-packages
        with:
          packages: gcc-multilib

      - name: Install Rust
        run: |
          rustup toolchain install
          rustup target add "$CARGO_BUILD_TARGET"
          cargo --version

      # The key: see the lint job.
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ hashFiles('Cargo.toml') }}

      - name: Test without default features
        run: cargo test -p vulkan --no-default-features
